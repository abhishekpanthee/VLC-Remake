# Builds the Windows package (macOS is built locally) with VLC's own packaging scripts
# (the same recipes as VideoLAN's CI, extras/package/*/build.sh).
#
# - Run it from the Actions tab ("Run workflow"), or
# - push a tag such as v0.1.0 to also publish a GitHub release.
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # Last upstream VLC commit that changed contrib/, extras/tools/ or extras/ci/
  # (this repository has no upstream history). VideoLAN publishes prebuilt
  # contribs for it; when they are unavailable, contribs are built from source.
  UPSTREAM_CONTRIB_SHA: 3d2ba807064c942952f5699370439b572809a795

jobs:
  windows:
    name: Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      # VideoLAN's Windows cross-compilation image (see upstream extras/ci/gitlab-ci.yml)
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      # the image runs as the "videolan" user, GitHub's actions need root
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Use prebuilt contribs if available
        shell: bash
        run: |
          url="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${UPSTREAM_CONTRIB_SHA}.tar.zst"
          if extras/ci/check-url.sh "$url"; then
            echo "VLC_PREBUILT_CONTRIBS_URL=$url" >> "$GITHUB_ENV"
          else
            echo "Prebuilt contribs not found, they will be built from source (slow)"
          fi

      - name: Build and package
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # -r release, -p prebuilt contribs (falls back to building them); compile only,
          # the packages are made below (the .msi needs WiX, not in the image)
          extras/package/win32/build.sh -a x86_64 -r -p

      - name: Package (zip, 7z)
        shell: bash
        run: make -C win64 package-win32-zip package-win32-7zip

      - name: Package (exe installer, optional)
        shell: bash
        continue-on-error: true
        run: make -C win64 package-win32-exe

      - name: Collect packages
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          find . -maxdepth 3 -type f \( -name 'vlc-*.exe' -o -name 'vlc-*.zip' -o -name 'vlc-*.7z' -o -name 'vlc-*.msi' \) \
               -not -path './dist/*' -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlc-remake-windows-x64
          path: dist/*

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: VLC Remake ${{ github.ref_name }}
          files: dist/*
          body: |
            Unofficial build of VLC media player with the redesigned interface.
            VLC media player is © VideoLAN and the VLC authors, GNU GPL v2 or later.
            The packages are not code signed (see the README).

# Builds VLC Remake for Windows and Linux (macOS is built on a Mac with
# extras/package/macosx/build-remake.sh and attached to the release).
#
# - Actions tab > Build > "Run workflow": choose the platforms to build and,
#   optionally, a release tag to add the packages to (an existing release,
#   such as v0.1.4, keeps its other files). Windows is off by default.
# - Pushing a tag such as v0.3.0 builds all the platforms and publishes a
#   new release.
name: Build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Build Windows"
        type: boolean
        default: true
      linux:
        description: "Build Linux"
        type: boolean
        default: true
      release_tag:
        description: "Add the packages to this release, e.g. v0.1.4 (empty: no release)"
        type: string
        default: ""
  push:
    tags:
      - "v*"

env:
  # Last upstream VLC commit that changed contrib/, extras/tools/ or extras/ci/
  # (this repository has no upstream history). VideoLAN publishes prebuilt
  # contribs for it; when they are unavailable, contribs are built from source.
  UPSTREAM_CONTRIB_SHA: 3d2ba807064c942952f5699370439b572809a795

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    if: github.event_name == 'push' || inputs.windows
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    container:
      # VideoLAN's Windows cross-compilation image (see upstream extras/ci/gitlab-ci.yml)
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      # the image runs as the "videolan" user, GitHub's actions need root
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Use prebuilt contribs if available
        shell: bash
        run: |
          url="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-${UPSTREAM_CONTRIB_SHA}.tar.zst"
          if extras/ci/check-url.sh "$url"; then
            echo "VLC_PREBUILT_CONTRIBS_URL=$url" >> "$GITHUB_ENV"
          else
            echo "Prebuilt contribs not found, they will be built from source (slow)"
          fi

      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # -r release, -p prebuilt contribs (falls back to building them); compile only,
          # the packages are made below (the .msi needs WiX, not in the image)
          extras/package/win32/build.sh -a x86_64 -r -p

      - name: Package (installer)
        shell: bash
        run: make -C win64 package-win32-exe

      - name: Collect packages
        if: always()
        shell: bash
        run: |
          mkdir -p dist
          exe="$(find . -maxdepth 3 -type f -name 'vlc-*-win64*.exe' -not -path './dist/*' | head -n1)"
          test -n "$exe"
          cp "$exe" dist/vlc-remake-windows-x64-setup.exe
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vlc-remake-windows-x64
          path: dist/*

  # ------------------------------------------------------------------ Linux
  linux:
    name: Linux x86_64 (Ubuntu 24.04)
    if: github.event_name == 'push' || inputs.linux
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config flex bison gettext autopoint libtool python3-pip curl \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev qt6-declarative-private-dev \
            qt6-svg-dev qt6-shadertools-dev qt6-5compat-dev \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtquick-dialogs \
            libxcb1-dev libxcb-composite0-dev libxcb-damage0-dev libxcb-keysyms1-dev libxcb-randr0-dev \
            libxcb-render0-dev libxcb-shm0-dev libxcb-xfixes0-dev libxcb-xkb-dev x11proto-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev \
            libwayland-dev wayland-protocols qt6-wayland \
            libgl-dev libegl-dev libgles-dev libva-dev libvdpau-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libasound2-dev \
            libfreetype-dev libfribidi-dev libharfbuzz-dev libfontconfig-dev libass-dev \
            libdav1d-dev libmpg123-dev libvorbis-dev libopus-dev libflac-dev libogg-dev \
            libtheora-dev libspeex-dev libspeexdsp-dev libmatroska-dev libebml-dev libdvbpsi-dev \
            libxml2-dev libtag1-dev liblua5.2-dev lua5.2 libgcrypt20-dev libgnutls28-dev \
            libdbus-1-dev libsystemd-dev libsqlite3-dev libjpeg-dev libpng-dev libxxhash-dev zlib1g-dev
          # VLC needs meson >= 1.10 (Ubuntu 24.04 ships 1.3)
          sudo python3 -m pip install --break-system-packages "meson>=1.10"
          meson --version

      - name: Build wayland-scanner 1.23
        # VLC needs wayland-scanner >= 1.23 (Ubuntu 24.04: 1.22); only the
        # code generator is built, the Wayland libraries stay the system ones
        run: |
          curl -fsSL -o wl.tar.gz http://archive.ubuntu.com/ubuntu/pool/main/w/wayland/wayland_1.23.1.orig.tar.gz
          mkdir wl && tar -xzf wl.tar.gz -C wl --strip-components=1
          cd wl
          meson setup build --prefix=/usr/local -Dlibraries=false -Ddocumentation=false -Dtests=false -Ddtd_validation=false
          sudo ninja -C build install
          echo "PKG_CONFIG_PATH=/usr/local/share/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig" >> "$GITHUB_ENV"

      - name: Build medialibrary 0.13
        run: |
          curl -fsSL -o ml.tar.gz https://archive.ubuntu.com/ubuntu/pool/universe/m/medialibrary/medialibrary_0.13.2.orig.tar.gz
          mkdir ml && tar -xzf ml.tar.gz -C ml --strip-components=1
          cd ml
          meson setup build --prefix=/usr -Dlibvlc=disabled -Dtests=disabled -Dbuildtype=release
          ninja -C build
          # install for the package first: "sudo ninja install" leaves root owned logs
          DESTDIR="$GITHUB_WORKSPACE/stage" ninja -C build install
          sudo ninja -C build install

      - name: Build VLC
        run: |
          # xcb and wayland required: the Qt X11 and Wayland compositors show the
          # video inside the window
          meson setup build --prefix=/usr -Dbuildtype=release -Dqt=enabled -Dmedialibrary=enabled \
            -Dx11=enabled -Dxcb=enabled -Dwayland=enabled -Dtests=disabled
          grep -q QT_HAS_X11_COMPOSITOR build/build.ninja
          grep -q QT_HAS_WAYLAND_COMPOSITOR build/build.ninja
          ninja -C build
          DESTDIR="$GITHUB_WORKSPACE/stage" ninja -C build install

      - name: Package
        run: |
          set -e
          APP=vlc-remake
          rm -rf "$APP" && mkdir "$APP"
          cp -a stage/usr/. "$APP/"
          cat > "$APP/vlc-remake" <<'EOF'
          #!/bin/sh
          # VLC Remake launcher: runs the bundled VLC from this folder
          HERE="$(dirname "$(readlink -f "$0")")"
          LIBDIR="$HERE/lib/x86_64-linux-gnu"
          export LD_LIBRARY_PATH="$LIBDIR:$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # plugins are found in $VLC_LIB_PATH/plugins
          export VLC_LIB_PATH="$LIBDIR/vlc"
          export VLC_LIBEXEC_PATH="$HERE/libexec/vlc"
          export VLC_DATA_PATH="$HERE/share/vlc"
          exec "$HERE/bin/vlc" "$@"
          EOF
          chmod +x "$APP/vlc-remake"
          # plugins cache (faster startup)
          LD_LIBRARY_PATH="$APP/lib/x86_64-linux-gnu" "$APP/libexec/vlc/vlc-cache-gen" \
            "$APP/lib/x86_64-linux-gnu/vlc/plugins" || true
          # Ubuntu packages providing the libraries the build links to
          find "$APP" -type f \( -name '*.so*' -o -path "*/bin/*" \) -exec ldd {} \; 2>/dev/null \
            | awk '/=> \//{print $3}' | sort -u \
            | grep -v "$GITHUB_WORKSPACE" | xargs -r -n1 dpkg -S 2>/dev/null | cut -d: -f1 | sort -u > pkgs.txt
          printf '%s\n' qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qt5compat-graphicaleffects qml6-module-qtquick-dialogs qt6-qpa-plugins \
            libqt6svg6 qt6-wayland >> pkgs.txt
          {
            echo "VLC Remake for Linux (built on Ubuntu 24.04, x86_64)"
            echo
            echo "1. Install the libraries it needs (Ubuntu 24.04 / Linux Mint 22 / Pop!_OS 24.04):"
            echo
            echo "   sudo apt install $(sort -u pkgs.txt | tr '\n' ' ')"
            echo
            echo "2. Run it:"
            echo
            echo "   ./vlc-remake"
            echo
            echo "VLC media player is (c) VideoLAN and the VLC authors, GNU GPL v2 or later."
          } > "$APP/README-LINUX.txt"
          mkdir -p dist
          tar -czf dist/vlc-remake-linux-x86_64.tar.gz "$APP"

          # .deb: installs to /opt/vlc-remake (next to any VLC from the distribution),
          # with a vlc-remake command and an applications menu entry
          DEB=deb-root
          rm -rf "$DEB"
          mkdir -p "$DEB/DEBIAN" "$DEB/opt" "$DEB/usr/bin" "$DEB/usr/share/applications"
          cp -a "$APP" "$DEB/opt/vlc-remake"
          cp share/icons/256x256/vlc.png "$DEB/opt/vlc-remake/vlc-remake.png"
          ln -s /opt/vlc-remake/vlc-remake "$DEB/usr/bin/vlc-remake"
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=VLC Remake' \
            'GenericName=Media player' 'Comment=VLC media player with the redesigned interface' \
            'Exec=/opt/vlc-remake/vlc-remake %U' 'Icon=/opt/vlc-remake/vlc-remake.png' 'Terminal=false' \
            'Categories=AudioVideo;Player;Video;Audio;' \
            'MimeType=video/mp4;video/x-matroska;video/webm;video/x-msvideo;video/quicktime;video/mpeg;audio/mpeg;audio/flac;audio/ogg;audio/x-wav;audio/mp4;' \
            > "$DEB/usr/share/applications/vlc-remake.desktop"
          VERSION="4.0.0~dev+remake${{ github.run_number }}"
          DEPENDS="$(sort -u pkgs.txt | grep -v '^$' | paste -sd, - | sed 's/,/, /g')"
          {
            echo "Package: vlc-remake"
            echo "Version: $VERSION"
            echo "Architecture: amd64"
            echo "Maintainer: VLC Remake <noreply@github.com>"
            echo "Depends: $DEPENDS"
            echo "Section: video"
            echo "Priority: optional"
            echo "Homepage: https://github.com/${{ github.repository }}"
            echo "Description: VLC media player with a redesigned interface (unofficial)"
            echo " Unofficial build of VLC media player (VideoLAN and the VLC authors,"
            echo " GNU GPL v2 or later) with the community VLC Redesign interface."
            echo " Installs to /opt/vlc-remake, run it with vlc-remake."
          } > "$DEB/DEBIAN/control"
          cat "$DEB/DEBIAN/control"
          dpkg-deb --root-owner-group --build "$DEB" dist/vlc-remake-linux-amd64.deb
          ls -la dist

      - name: AppImage
        # runs on most distributions: bundles Qt and the libraries
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/lib/qt6/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/modules/gui/qt
          EXTRA_PLATFORM_PLUGINS: "libqwayland-egl.so;libqwayland-generic.so"
          EXTRA_QT_MODULES: "waylandclient;svg"
          OUTPUT: vlc-remake-linux-x86_64.AppImage
        run: |
          set -e
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          rm -rf AppDir && mkdir -p AppDir/usr AppDir/apprun-hooks
          cp -a stage/usr/. AppDir/usr/
          LIBDIR=usr/lib/x86_64-linux-gnu
          cat > AppDir/apprun-hooks/vlc-remake.sh <<'EOF'
          export LD_LIBRARY_PATH="$APPDIR/usr/lib:$APPDIR/usr/lib/x86_64-linux-gnu:$APPDIR/usr/lib/x86_64-linux-gnu/vlc${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VLC_LIB_PATH="$APPDIR/usr/lib/x86_64-linux-gnu/vlc"
          export VLC_LIBEXEC_PATH="$APPDIR/usr/libexec/vlc"
          export VLC_DATA_PATH="$APPDIR/usr/share/vlc"
          EOF
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=VLC Remake' 'Exec=vlc %U' \
            'Icon=vlc-remake' 'Categories=AudioVideo;Player;Video;Audio;' 'Terminal=false' > vlc-remake.desktop
          cp share/icons/256x256/vlc.png vlc-remake.png
          # libvlc, libvlccore (AppDir/$LIBDIR) and VLC's helper libraries (AppDir/$LIBDIR/vlc)
          export LD_LIBRARY_PATH="$PWD/AppDir/$LIBDIR:$PWD/AppDir/$LIBDIR/vlc:$PWD/AppDir/usr/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./linuxdeploy --appdir AppDir -e AppDir/usr/bin/vlc \
            --deploy-deps-only "AppDir/$LIBDIR/vlc/plugins" --deploy-deps-only "AppDir/$LIBDIR" \
            -d vlc-remake.desktop -i vlc-remake.png --plugin qt --output appimage
          LD_LIBRARY_PATH="AppDir/$LIBDIR" "AppDir/usr/libexec/vlc/vlc-cache-gen" "AppDir/$LIBDIR/vlc/plugins" || true
          mv vlc-remake-linux-x86_64.AppImage dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: vlc-remake-linux-x86_64
          path: dist/*

  # ---------------------------------------------------------------- Release
  release:
    name: Release
    # publish the packages that were built (a platform that failed or was not
    # selected is simply missing), to the tag pushed or the release_tag input
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') &&
      contains(needs.*.result, 'success')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * | tee SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: VLC Remake ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          body: |
            Unofficial build of VLC media player with the redesigned interface.
            VLC media player is © VideoLAN and the VLC authors, GNU GPL v2 or later.

            **Which file do I download?** See the [download guide](https://github.com/${{ github.repository }}#download).

            | System | File |
            |---|---|
            | Windows 10/11 (64-bit) | `vlc-remake-windows-x64-setup.exe` |
            | macOS 12+ Apple Silicon (M1 and later) | `vlc-remake-macos-arm64.dmg` |
            | macOS 12+ Intel | `vlc-remake-macos-x86_64.dmg` (when available) |
            | Ubuntu 24.04, Mint 22, Pop!_OS 24.04 | `vlc-remake-linux-amd64.deb` |
            | Other Linux distributions | `vlc-remake-linux-x86_64.AppImage` |

            The packages are not code signed: see the README for the first launch.
